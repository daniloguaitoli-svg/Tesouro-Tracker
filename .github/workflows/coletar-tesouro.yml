# Coleta agendada da série oficial do Tesouro Direto.
#
# POR QUE ESTE JOB EXISTE: o CSV do Tesouro Transparente tem dezenas de MB e o
# histórico inteiro desde 2002 — grande demais para ser varrido dentro de uma
# função serverless a cada request. Aqui ele é lido uma vez por dia, destilado
# em dados/historico.json (a série que o app usa) e em dados/ntnb.json +
# dados/ntnb.md (o retrato do dia, com duration).
#
# Efeito colateral desejado, e o principal: como o repositório é público, esses
# dois arquivos ficam legíveis por raw.githubusercontent.com SEM TOKEN. É a
# ponte para qualquer ferramenta que não alcance a fonte original.
#
# Cada execução que muda os arquivos gera um commit, que dispara um deploy novo
# na Vercel — é assim que o dado novo chega ao ar.
#
# ATENÇÃO: o GitHub suspende workflows agendados após 60 dias sem atividade no
# repositório. Se a coleta parar sozinha, reative na aba Actions.

name: Coletar Tesouro

on:
  schedule:
    # 11:23, 14:23, 17:23, 20:23 e 23:23 UTC = 8h, 11h, 14h, 17h e 20h de
    # Brasília, TODO DIA. Duas escolhas aqui, ambas aprendidas na prática:
    #
    # MINUTO 23, NÃO 0. O GitHub atrasa ou simplesmente DESCARTA execuções
    # agendadas em períodos de carga alta, e o pico é a virada da hora — que é
    # exatamente onde estava o agendamento anterior ("0 13,22"). O resultado
    # apareceu no histórico: a execução de 26/08 22:00 só rodou às 02:23 do dia
    # seguinte, e as de 27/08 e 28/08 às 13:00 nunca rodaram. O app ficou dois
    # dias mostrando preço velho com a coleta "funcionando".
    #
    # CINCO TENTATIVAS, TODO DIA, e não duas em dia útil. O arquivo do Tesouro
    # não sai em horário fixo: entre 24/08 e 26/08 de manhã ele ficou parado em
    # 21/08 e depois publicou 22, 25 e 26 de uma vez, de madrugada. Com poucas
    # janelas, uma execução perdida custa um dia inteiro de defasagem; com
    # cinco, o próximo tiro é em três horas. Rodar de sábado e domingo pega o
    # lote que sai na sexta à noite em vez de esperar até segunda.
    #
    # O custo disso é ~zero: o repositório é público (minutos de Actions
    # gratuitos e ilimitados), o job leva ~40s e só COMMITA quando algum número
    # mudou — então não gera deploy nem ruído à toa.
    - cron: "23 11,14,17,20,23 * * *"
  workflow_dispatch:
  # Numa branch de trabalho que NÃO seja a padrão, o job roda em DRY-RUN: baixa,
  # parseia e relata, sem gravar nem commitar. É como se confere que os parsers
  # ainda batem com o formato real das fontes antes de o código virar oficial.
  push:
    branches: ["claude/**"]

permissions:
  contents: write

concurrency:
  group: coletar-tesouro
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # A condição segue a branch PADRÃO do repositório, não um nome fixo.
      #
      # Por quê: gravar só em "refs/heads/main" parece seguro até o repositório
      # ter outro nome de branch padrão — aí o coletor roda, acerta tudo, e
      # nunca grava nada, silenciosamente. Comparar com
      # github.event.repository.default_branch faz a regra ser "a branch oficial
      # deste repositório", que é o que se queria dizer desde o começo, e
      # continua valendo se um dia ela for renomeada para main.
      #
      # `github.event_name != 'push'` cobre schedule e workflow_dispatch, onde o
      # payload não traz repository.default_branch — e onde gravar é sempre a
      # intenção (o agendamento só dispara na própria branch padrão).
      - name: Coletar e gravar (branch padrão)
        if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: node .github/scripts/coletar-tesouro.mjs

      - name: Conferir os parsers contra as fontes reais (dry-run)
        if: github.event_name == 'push' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        run: node .github/scripts/coletar-tesouro.mjs --dry-run

      - name: Commitar os dados atualizados
        if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/historico.json dados/ntnb.json dados/ntnb.md dados/prefixado.json dados/selic.json dados/global.json dados/painel.json dados/painel.md
          git diff --staged --quiet || git commit -m "Dados: coleta automatica das NTN-B"
          git push
